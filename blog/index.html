<script>
  /* set the theme before first paint; light is the default */
  (function () {
    var d = document.documentElement;
    d.classList.add('js');
    try { if (localStorage.getItem('theme') === 'dark') d.setAttribute('data-theme', 'dark'); } catch (e) {}
    setTimeout(function () { if (!window.__siteReady) d.classList.remove('js'); }, 4000);
  })();
</script>
